# Quality-gate the manual bronze account_customer map.
# Row failures go to the same DLQ inbox as invoice join quarantine
# (dlq_table shared; source_table tags these rows for recycle).
pipeline: account_customer_dq
flowgroup: account_customer_quality

actions:
  - name: load_account_customer_bronze
    type: load
    readMode: stream
    source:
      type: delta
      catalog: "${catalog}"
      schema: "${bronze_schema}"
      table: account_customer
      options:
        readChangeFeed: "true"
      where_clause:
        - "_change_type IN ('insert', 'update_postimage')"
        - "__END_AT IS NULL"
      select_columns: [account, customer]
    target: v_account_customer
    description: "Stream new current SCD2 account-customer versions"
    # Demo rows: pipelines/sample_data/account_customer.csv

  - name: quarantine_account_customer
    type: transform
    transform_type: data_quality
    source: v_account_customer
    target: v_account_customer_validated
    readMode: stream
    mode: quarantine
    expectations_file: expectations/account_customer_quality.yaml
    quarantine:
      dlq_table: "${catalog}.${dq_schema}.invoice_join_dlq"
      source_table: "${catalog}.${silver_schema}.account_customer"
    description: "Quarantine invalid map rows into the shared DLQ"

  - name: write_account_customer_silver
    type: write
    source: v_account_customer_validated
    write_target:
      type: streaming_table
      catalog: "${catalog}"
      schema: "${silver_schema}"
      table: account_customer
