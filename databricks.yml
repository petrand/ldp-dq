# This is a Databricks asset bundle definition for ldp-dq.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ldp-dq
  uuid: b39d3316-6097-445e-bd41-9a2a1ecdb001

include:
  # User-managed resource files (shared across all environments)
  - resources/*.yml
  - resources/lhp/*.yml

# generated/ is gitignored but must be uploaded for Lakeflow libraries
sync:
  include:
    - generated
    - generated/**

targets:
  # ⚠️ IMPORTANT: Target names MUST match your LHP substitution environment names
  # - Each target name should have a corresponding substitutions/{env}.yaml file
  # LHP automatically adds environment-specific variables to each corresponding target below.
  
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://fevm-ssas-pbi-mv-migration.cloud.databricks.com
      root_path: ~/.bundle/${bundle.name}/${bundle.target}

  
  tst:
    mode: production
    workspace:
      host: <databricks_host>
      # We explicitly deploy to /Workspace/Users/<USERNAME> to make sure we only have a single copy.
      root_path: /Workspace/<code_location>/.bundle/${bundle.name}/${bundle.target}
    permissions:
      permissions:
      - service_principal_name: <service_principal_id>
        level: CAN_MANAGE
    run_as:
      service_principal_name: <service_principal_id>

  prod:
    mode: production
    workspace:
      host: <databricks_host>
      # We explicitly deploy to /Workspace/Users/<USERNAME> to make sure we only have a single copy.
      root_path: /Workspace/<code_location>/.bundle/${bundle.name}/${bundle.target}
    permissions:
      permissions:
      - service_principal_name: <service_principal_id>
        level: CAN_MANAGE
    run_as:
      service_principal_name: <service_principal_id>